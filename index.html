<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillPrint AI | Prove what you can do — not where you come from | SAP Hackfest 2026</title>
  <meta name="description" content="Explainable skills identity for candidates, built from verified evidence of capability instead of résumé keywords or institution prestige. SAP Hackfest 2026 (Inclusive Workforce).">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- Google Fonts: Inter and JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            sap: {
              primary: '#0070F2',
              'primary-hover': '#0056ba',
              navy: '#0B1F33',
              teal: '#0F9D8A',
              purple: '#6B4FA3',
              orange: '#F58B1F',
              green: '#2BA05A',
              red: '#D13B47',
              bg: '#F0F4F9'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          animation: {
            fadeIn: 'fadeIn 0.25s ease-in-out',
            pulseSlow: 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(4px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            }
          }
        }
      }
    };
  </script>

  <!-- SAP Fiori Horizon Stylesheet -->
  <link rel="stylesheet" href="css/fiori-horizon.css">

  <!-- React 18 & ReactDOM 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body class="bg-[#F0F4F9] dark:bg-[#0D131C] text-[#0B1F33] dark:text-[#E6EDF5] min-h-screen">
  <!-- React Root Container -->
  <div id="root"></div>

  <!-- SkillPrint AI Application Scripts -->
  <script src="js/mockData.js"></script>
  <script src="js/sesEngine.js"></script>
  <script src="js/components/ShellBar.js"></script>
  <script src="js/components/SideNav.js"></script>
  <script src="js/components/Footer.js"></script>
  <script src="js/components/WeightModal.js"></script>
  <script src="js/components/AddEvidenceModal.js"></script>
  <script src="js/components/ExplainDrawer.js"></script>
  <script src="js/pages/LandingPage.js"></script>
  <script src="js/pages/CandidatePage.js"></script>
  <script src="js/pages/RecruiterPage.js"></script>
  <script src="js/pages/AgenticWorkflowPage.js"></script>
  <script src="js/pages/SapArchitecturePage.js"></script>
  <script src="js/pages/ImpactScalePage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
