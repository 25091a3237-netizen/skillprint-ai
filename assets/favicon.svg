  <path d="M 20 32 A 12 12 0 0 1 27 21" stroke="#6B4FA3" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Evidence verification pulse nodes -->
  <circle cx="32" cy="14" r="3" fill="#2BA05A" />
  <circle cx="50" cy="32" r="3.5" fill="#0070F2" />
  <circle cx="38" cy="32" r="2.5" fill="#F58B1F" />
